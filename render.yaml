# Blueprint da Render: no painel, New > Blueprint e escolha este repositório.
# Os campos com "sync: false" são pedidos na tela durante a criação (segredos que não ficam no Git).
services:
  - type: web
    name: garimpo
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Supabase > Connect > "Session pooler". A conexão direta (db.xxx.supabase.co) não funciona na Render (só IPv6).
      - key: DATABASE_URL
        sync: false
      # Gerados pela Render na criação. Não troque a ENCRYPTION_KEY depois: o token do Instagram salvo deixa de abrir.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: https://wjtvngpknwrbtzfiphyg.supabase.co
      # Supabase > Project Settings > API
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Depois de criar a sua conta, troque para false e salve.
      - key: ALLOW_SIGNUP
        value: "true"
      # Opcional: textos gerados por IA. Pode deixar em branco.
      - key: ANTHROPIC_API_KEY
        sync: false
